<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El retrato borrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
/* Una noche de Feria: fondo añil, madera de taberna, amarillo farolillo y rosa buganvilla.
   Disposición: escenario 2:1 arriba, frase de acción, y debajo verbos + inventario. */
:root {
  --noche: #17152b;
  --madera: #2a2445;
  --borde: #4b3f7a;
  --crema: #f6efd9;
  --farol: #f4c430;
  --buganvilla: #e23a7a;
  --pixel: "VT323", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--noche); color: var(--crema); font-family: var(--pixel); font-size: 20px; }
body { padding: 12px 16px 24px; }
.game { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 30px; font-weight: 400; margin: 0; color: var(--farol); letter-spacing: 1px; }
#roomname { flex: 1; color: #b9afd9; font-size: 20px; min-width: 10ch; }
.tool { font: inherit; font-size: 18px; color: var(--crema); background: none; border: 2px solid var(--borde); padding: 0 10px; cursor: pointer; }
.tool:hover, .tool:focus-visible { border-color: var(--farol); color: var(--farol); outline: none; }
#stage { position: relative; aspect-ratio: 2 / 1; background: #000; border: 3px solid var(--borde); container-type: inline-size; overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; transition: opacity .16s linear; }
#speech { position: absolute; max-width: 64%; font-size: clamp(16px, 3.3cqw, 32px); line-height: .95; text-align: center; text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 2px 2px #000, -2px -2px #000, 2px -2px #000, -2px 2px #000; cursor: pointer; text-wrap: balance; }
#toast { position: absolute; right: 8px; bottom: 8px; background: var(--farol); color: #2a1d00; padding: 0 10px; font-size: clamp(14px, 2.4cqw, 22px); }
#overlay { position: fixed; inset: 0; background: rgba(15, 12, 35, .86); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
#overlay[hidden], #speech[hidden], #toast[hidden] { display: none; }
.sheet { background: #f3ead2; color: #2c2416; max-width: 62ch; max-height: 100%; overflow: auto; padding: 14px 20px; border: 3px solid #b8892e; display: flex; flex-direction: column; gap: 8px; font-size: clamp(16px, 2.4vw, 22px); line-height: 1.05; }
.sheet h2 { margin: 0; font-weight: 400; font-size: 1.35em; color: #8c1b22; }
.sheet p { margin: 0; }
.sheet .verb { align-self: flex-end; background: #2a2445; }
.carta { font-style: italic; display: flex; flex-direction: column; gap: 8px; }
.carta .firma { text-align: right; }
.notes { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
#sentence { min-height: 1.2em; font-size: 24px; color: var(--farol); text-align: center; background: var(--madera); border: 2px solid var(--borde); padding: 0 8px; }
#panel { display: grid; grid-template-columns: minmax(200px, 1fr) 2fr; gap: 8px; }
#verbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start; }
.verb { font: inherit; font-size: 24px; color: var(--crema); background: var(--madera); border: 2px solid var(--borde); padding: 4px 6px; cursor: pointer; }
.verb:hover, .verb:focus-visible { color: var(--farol); border-color: var(--farol); outline: none; }
.verb.on { background: var(--buganvilla); border-color: var(--crema); color: #fff; }
#inv { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.item { aspect-ratio: 1; background: var(--madera); border: 2px solid var(--borde); padding: 2px; cursor: pointer; display: block; }
.item.empty { cursor: default; opacity: .45; }
.item img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
button.item:hover, button.item:focus-visible { border-color: var(--farol); outline: none; }
.item.on { border-color: var(--crema); background: var(--buganvilla); }
#dialog { display: none; flex-direction: column; gap: 4px; grid-column: 1 / -1; }
#panel.talk #verbs, #panel.talk #inv { display: none; }
#panel.talk #dialog { display: flex; }
.opt { font: inherit; font-size: 23px; text-align: left; color: var(--crema); background: var(--madera); border: 2px solid var(--borde); padding: 2px 10px; cursor: pointer; }
.opt:hover, .opt:focus-visible { color: var(--farol); border-color: var(--farol); outline: none; }
.tool[hidden] { display: none; }
#btn-map { border-color: var(--farol); background: var(--farol); color: #2a1d00; font-size: 22px; padding: 0 14px; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(11em, 1fr)); gap: 5px; }
.place { font: inherit; text-align: left; background: #fffaf0; color: #2c2416; border: 2px solid #b8892e; padding: 1px 8px; cursor: pointer; }
.place:hover, .place:focus-visible { background: #f4c430; outline: none; }
.place.here { background: #e9dcc0; color: #8a7a55; border-style: dashed; }
.game-sheet { width: min(96%, 70ch); }
.slot { display: grid; grid-template-columns: 1.5em 1fr auto auto auto; gap: 6px; align-items: center; border-bottom: 1px dashed #b8892e; padding: 2px 0; }
.slot-n { color: #8c1b22; font-size: 1.2em; }
.slot-d { overflow-wrap: anywhere; }
#sv-code { font: inherit; font-size: .8em; width: 100%; background: #fffaf0; color: #2c2416; border: 2px solid #b8892e; padding: 4px; overflow-wrap: anywhere; }
@media (max-width: 560px) { .slot { grid-template-columns: 1.5em 1fr; } .slot .place { grid-column: 2; } }
.mg-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mg-slot, .mg-line { font: inherit; text-align: left; border: 2px solid #b8892e; background: #fffaf0; color: #2c2416; padding: 0 8px; cursor: pointer; min-height: 1.25em; width: 100%; }
.mg-slot.fixed { background: #e2d7b8; cursor: default; }
.mg-slot.bad { background: #cdbfa0; color: #7a6d50; filter: blur(.6px); }
.mg-line.sel, .mg-slot.sel { background: #f4c430; }
.mg-line.mirror { transform: scaleX(-1); text-align: right; background: #8d8f93; color: #1c1c1c; border-color: #55585e; font-style: normal; }
.mg-col { display: flex; flex-direction: column; gap: 3px; }
.mg-peg { font: inherit; font-size: 1.3em; width: 2.2em; border: 2px solid #b8892e; background: #fffaf0; color: #2c2416; cursor: pointer; }
.mg-peg.ok { background: #bfe3a8; }
.mg-say { min-height: 2.2em; color: #5a2a18; font-style: italic; }
.hint { color: #9a90bd; font-size: 17px; margin: 0; }
@media (max-width: 560px) {
  #panel { grid-template-columns: 1fr; }
  #verbs { grid-template-columns: repeat(5, 1fr); }
  .verb { font-size: 19px; padding: 4px 2px; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { #cv { transition: none; } }
</style>
</head>
<body>
<main class="game">
  <header>
    <h1>El retrato borrado</h1>
    <span id="roomname"></span>
    <button type="button" class="tool" id="btn-map" hidden>Mapa</button>
    <button type="button" class="tool" id="btn-saves">Partidas</button>
    <button type="button" class="tool" id="btn-help">Ayuda</button>
    <button type="button" class="tool" id="btn-reset">Empezar de nuevo</button>
  </header>
  <div id="stage">
    <canvas id="cv" width="320" height="160" aria-label="Escenario del juego"></canvas>
    <div id="speech" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <div id="sentence">&nbsp;</div>
  <div id="panel">
    <div id="verbs"></div>
    <div id="inv"></div>
    <div id="dialog"></div>
  </div>
  <p class="hint">Clic para caminar · Verbo y clic para actuar · Clic derecho para mirar · Flechas amarillas en los bordes para pasar a la pantalla de al lado · Mapa (tecla M) para ir directo</p>
</main>
<div id="overlay" hidden></div>
<script src="js/art.js"></script>
<script src="js/engine.js"></script>
<script src="js/act1.js"></script>
<script src="js/art2.js"></script>
<script src="js/act2.js"></script>
<script src="js/act3.js"></script>
<script src="js/perchel.js"></script>
<script src="js/fondos2.js"></script>
<script src="js/rutas.js"></script>
<script src="js/charlas.js"></script>
<script src="js/salero.js"></script>
</body>
</html>
